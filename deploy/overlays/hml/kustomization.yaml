apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina-hml

resources:
  - ../../base


patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: external-secret-patch.yaml

configMapGenerator:
  - name: oficina-execucao-config
    behavior: merge
    literals:
      - APP_ENV=homologacao
      - APP_DEBUG=false
      - NEW_RELIC_APP_NAME=oficina-execucao-hml

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: oficina-execucao
    newName: oficina-execucao
    newTag: hml
