# Só as chaves que este serviço usa (docs/fase-4/CONTRATOS.md §3, no oficina-api).
# O ambiente (hml/prod) é trocado pelo patch de cada overlay.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: oficina-execucao-secret
  labels:
    app.kubernetes.io/part-of: oficina-mecanica
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: oficina-secretsmanager
    kind: ClusterSecretStore
  target:
    name: oficina-execucao-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: oficina/hml/auth, property: JWT_SECRET }
